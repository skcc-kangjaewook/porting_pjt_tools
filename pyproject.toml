[tool.ruff]
line-length = 120
ignore = ["D100"]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "D",  # pydocstyle
    "I",  # isort
    "B",  # bugbear
    "N",  # pep8-naming
    "S"   # security
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends","fastapi.params.Depends",
  # "fastapi.Query","fastapi.params.Query",
  # "fastapi.Body","fastapi.params.Body",
  # "fastapi.Header","fastapi.params.Header",
  # "fastapi.Path","fastapi.params.Path",
  # "fastapi.Cookie","fastapi.params.Cookie",
  # "fastapi.File","fastapi.params.File",
  # "fastapi.Form","fastapi.params.Form",
  # "fastapi.Security","fastapi.params.Security",
]

[tool.commitizen]
# name = "cz_conventional_commits"
name = "cz_customize"
version = "4.10.0"

[tool.commitizen.customize]
message_template = "{{type}}: {{message}}"

questions = [
  { name = "type", type = "list", message = "Select the type of change you are committing", choices = [
      { value = "feat", name = "새로운 기능 추가" },
      { value = "fix", name = "버그 수정" },
      { value = "docs", name = "문서 변경" },
      { value = "style", name = "코드 스타일 변경" },
      { value = "refactor", name = "리팩토링" },
      { value = "perf", name = "성능 개선" },
      { value = "test", name = "테스트 추가/수정" },
      { value = "build", name = "빌드/의존성 변경" },
      { value = "ci", name = "CI/CD 변경" },
      { value = "chore", name = "기타 변경 (예: .gitignore)" }
  ]},
  { name = "message", type = "input", message = "Commit message" }
]